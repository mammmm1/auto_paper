<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Auto Paper</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <aside class="sidebar">
      <div class="brand">
        <span class="brand-mark">AP</span>
        <div>
          <h1>Auto Paper</h1>
          <p>论文搜索、摘要与推荐</p>
        </div>
      </div>

      <form id="topic-form" class="topic-form">
        <label>
          主题名称
          <input name="name" required placeholder="例如：AI Agent" />
        </label>
        <label>
          arXiv 搜索语句
          <textarea name="query" required rows="4" placeholder='例如：cat:cs.AI AND "large language model"'></textarea>
        </label>
        <label>
          每次数量
          <input name="max_results" type="number" min="1" max="50" value="10" />
        </label>
        <button type="submit">新增主题</button>
      </form>

      <section>
        <div class="section-title">
          <span>主题</span>
          <button id="refresh-topics" class="ghost" type="button">刷新</button>
        </div>
        <div id="topics" class="topic-list"></div>
      </section>
    </aside>

    <main class="main">
      <header class="toolbar">
        <div>
          <p class="eyebrow">Daily Research Loop</p>
          <h2>今日论文推荐</h2>
        </div>
        <div class="actions">
          <button id="run-search" type="button">运行今日搜索</button>
          <a class="button secondary" href="/api/export?format=markdown">下载 Markdown</a>
          <a class="button secondary" href="/api/export?format=csv">下载 CSV</a>
        </div>
      </header>

      <div id="status" class="status">准备就绪</div>
      <section id="papers" class="paper-list"></section>
    </main>

    <script src="/app.js"></script>
  </body>
</html>
