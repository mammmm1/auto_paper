<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Auto Paper</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <aside class="sidebar">
      <div class="brand">
        <span class="brand-mark">AP</span>
        <div>
          <h1>Auto Paper</h1>
          <p>可缝合科研素材工作台</p>
        </div>
      </div>

      <form id="project-form" class="project-form">
        <input name="id" type="hidden" />
        <label>
          项目名称
          <input name="name" required placeholder="遥感 Transformer 分层偏向" />
        </label>
        <div class="field-grid">
          <label>
            研究领域
            <input name="domain" placeholder="遥感图像" />
          </label>
          <label>
            任务类型
            <input name="task_type" placeholder="目标检测" />
          </label>
        </div>
        <label>
          当前 idea
          <textarea name="idea" required rows="4" placeholder="Transformer 浅层偏向小物体、深层偏向大物体..."></textarea>
        </label>
        <label>
          关键词
          <textarea name="keywords" rows="3" placeholder="remote sensing, transformer, small object, multi-scale feature"></textarea>
        </label>
        <div class="field-grid">
          <label>
            Backbone
            <input name="backbone" placeholder="Swin Transformer" />
          </label>
          <label>
            Neck
            <input name="neck" placeholder="FPN" />
          </label>
          <label>
            Head
            <input name="head" placeholder="Detection Head" />
          </label>
          <label>
            Dataset
            <input name="dataset" placeholder="DOTA / DIOR" />
          </label>
        </div>
        <label>
          每次数量
          <input name="max_results" type="number" min="1" max="50" value="20" />
        </label>
        <button type="submit">保存项目画像</button>
      </form>

      <section>
        <div class="section-title">
          <span>项目</span>
          <button id="refresh-projects" class="ghost" type="button">刷新</button>
        </div>
        <div id="projects" class="project-list"></div>
      </section>
    </aside>

    <main class="main">
      <header class="toolbar">
        <div>
          <p class="eyebrow">Material Workbench</p>
          <h2>可缝合素材看板</h2>
        </div>
        <div class="actions">
          <button id="run-search" type="button">搜索可缝合素材</button>
          <a class="button secondary" href="/api/export?format=markdown">下载 Markdown</a>
          <a class="button secondary" href="/api/export?format=csv">下载 CSV</a>
        </div>
      </header>

      <div class="status-row">
        <div id="status" class="status">准备就绪</div>
        <section id="board-metrics" class="board-metrics"></section>
      </div>
      <section id="profile-summary" class="profile-summary"></section>
      <section id="board" class="material-board"></section>
    </main>

    <script src="/app.js"></script>
  </body>
</html>
