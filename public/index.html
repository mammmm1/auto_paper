<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Auto Paper</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <aside class="sidebar">
      <div class="brand">
        <span class="brand-mark">AP</span>
        <div>
          <h1>Auto Paper</h1>
          <p>可缝合科研素材工作台</p>
        </div>
      </div>

      <form id="project-form" class="project-form">
        <input name="id" type="hidden" />
        <label>
          项目名称
          <input name="name" required placeholder="遥感 Transformer 分层偏向" />
        </label>
        <div class="field-grid">
          <label>
            研究领域
            <input name="domain" placeholder="遥感图像" />
          </label>
          <label>
            任务类型
            <input name="task_type" placeholder="目标检测" />
          </label>
        </div>
        <label>
          当前 idea
          <textarea name="idea" required rows="4" placeholder="Transformer 浅层偏向小物体、深层偏向大物体..."></textarea>
        </label>
        <label>
          关键词
          <textarea name="keywords" rows="3" placeholder="remote sensing, transformer, small object, multi-scale feature"></textarea>
        </label>
        <div class="field-grid">
          <label>
            Backbone
            <input name="backbone" placeholder="Swin Transformer" />
          </label>
          <label>
            Neck
            <input name="neck" placeholder="FPN" />
          </label>
          <label>
            Head
            <input name="head" placeholder="Detection Head" />
          </label>
          <label>
            Dataset
            <input name="dataset" placeholder="DOTA / DIOR" />
          </label>
        </div>
        <label>
          每次数量
          <input name="max_results" type="number" min="1" max="50" value="20" />
        </label>
        <button type="submit">保存项目画像</button>
      </form>

      <section>
        <div class="section-title">
          <span>项目</span>
          <button id="refresh-projects" class="ghost" type="button">刷新</button>
        </div>
        <div id="projects" class="project-list"></div>
      </section>
    </aside>

    <main class="main">
      <header class="toolbar">
        <div>
          <p class="eyebrow">Material Workbench</p>
          <h2>可缝合素材看板</h2>
        </div>
        <div class="actions">
          <button id="run-search" type="button">搜索可缝合素材</button>
          <button id="analyze-top" class="secondary" type="button">分析 Top 10</button>
          <button id="toggle-basket" class="secondary" type="button">方案篮子 <span id="basket-count">0</span></button>
          <a id="export-markdown" class="button secondary" href="/api/export?format=markdown">下载 Markdown</a>
          <a id="export-csv" class="button secondary" href="/api/export?format=csv">下载 CSV</a>
        </div>
      </header>

      <div class="status-row">
        <div id="status" class="status">准备就绪</div>
        <section id="board-metrics" class="board-metrics"></section>
      </div>
      <section id="profile-summary" class="profile-summary"></section>
      <section id="profile-check" class="profile-check"></section>
      <section class="quality-panel">
        <div class="quality-title">
          <span class="summary-label">Quality Loop</span>
          <strong>Top 10 推荐质量</strong>
        </div>
        <div id="quality-metrics" class="quality-metrics"></div>
      </section>
      <div class="workbench-controls">
        <div class="filter-controls">
          <div id="view-modes" class="segmented-control" aria-label="素材视图">
            <button class="active" data-view="top" type="button">Top 10</button>
            <button data-view="all" type="button">全部有效</button>
            <button data-view="code" type="button">有代码</button>
            <button data-view="low" type="button">低成本</button>
          </div>
          <select id="area-filter" aria-label="按接入位置筛选">
            <option value="all">全部位置</option>
            <option value="Backbone">Backbone</option>
            <option value="Neck">Neck</option>
            <option value="Head">Head</option>
            <option value="Loss">Loss</option>
            <option value="Data">Data</option>
            <option value="Training">Training</option>
            <option value="Experiment">Experiment</option>
          </select>
          <label class="switch-control">
            <input id="show-irrelevant" type="checkbox" />
            <span>显示参考/不相关</span>
          </label>
        </div>
        <span id="filter-summary" class="filter-summary"></span>
      </div>
      <section id="basket-panel" class="basket-panel" hidden>
        <header>
          <div>
            <span class="summary-label">Experiment Route</span>
            <h3>方案篮子</h3>
          </div>
          <div class="basket-actions">
            <button id="generate-route" type="button">生成实验路线</button>
            <button id="close-basket" class="icon-button ghost" type="button" title="关闭方案篮子" aria-label="关闭方案篮子">×</button>
          </div>
        </header>
        <div id="basket-items" class="basket-items"></div>
        <div id="route-result" class="route-result"></div>
      </section>
      <section id="board" class="material-board"></section>
    </main>

    <div id="analysis-overlay" class="analysis-overlay" hidden></div>
    <aside id="analysis-drawer" class="analysis-drawer" hidden aria-label="论文深度缝合分析">
      <header class="analysis-header">
        <div>
          <span class="summary-label">Deep Stitch Analysis</span>
          <h3 id="analysis-title">深度缝合分析</h3>
          <p id="analysis-meta"></p>
        </div>
        <div class="analysis-header-actions">
          <button id="refresh-analysis" class="secondary" type="button">重新分析</button>
          <button id="close-analysis" class="icon-button ghost" type="button" title="关闭分析" aria-label="关闭分析">×</button>
        </div>
      </header>
      <div id="analysis-content" class="analysis-content"></div>
    </aside>

    <script src="/app.js"></script>
  </body>
</html>
